<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#347d57"/>
      <stop offset="100%" stop-color="#1b4d35"/>
    </linearGradient>
    <linearGradient id="favFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8dec2"/>
      <stop offset="100%" stop-color="#6ec599"/>
    </linearGradient>
    <linearGradient id="favS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a6d4b"/>
      <stop offset="100%" stop-color="#194830"/>
    </linearGradient>
    <filter id="favDrop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#0b2418" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)"/>

  <!-- Tilted Back Document (Layered / multi-page feel) -->
  <rect x="14" y="11" width="34" height="42" rx="4" fill="#e2f4ea" fill-opacity="0.28" transform="rotate(-6 31 32)"/>

  <!-- Main Document Body -->
  <path d="M17 12 h19 l12 12 v25 a3.5 3.5 0 0 1 -3.5 3.5 h-24 a3.5 3.5 0 0 1 -3.5 -3.5 v-33.5 a3.5 3.5 0 0 1 3.5 -3.5 z"
        fill="#ffffff" filter="url(#favDrop)"/>

  <!-- Folded Corner Flap -->
  <path d="M36 12 v9 a3 3 0 0 0 3 3 h9 z" fill="url(#favFold)"/>

  <!-- Modern Scribd 'S' & Reader Motif inside document -->
  <path d="M26 25.5 c2.5 -2.2 7 -2.4 9.5 -0.4 c2.2 1.6 2 4.4 0.2 5.8 c-3.2 2.5 -7.2 3.1 -7.2 6.8 c0 2.8 2.8 4.5 6.8 4.1 c2.2 -0.2 4.4 -1.1 5.7 -2.2"
        fill="none" stroke="url(#favS)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Reader / Action Accent Dot -->
  <circle cx="38.5" cy="40.2" r="1.8" fill="#347d57"/>
</svg>
